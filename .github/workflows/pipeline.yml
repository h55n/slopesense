name: Source weather snapshots (no warning publication)
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-observations
  cancel-in-progress: false
jobs:
  fetch-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Require persistent store
        run: test -n "$DATABASE_URL"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Initialize non-spatial persistence
        run: python -m scripts.init_persistence
      - name: Fetch actual provider values (no FPI scoring or dispatch)
        run: python -m scripts.fetch_source_observations
